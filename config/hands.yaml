    side: left
    urdf: external_hand_models/fourier_models/Dexterous_hand/fourier_hand_6dof/urdf/fourier_left_hand_6dof.urdf
    model_source: https://github.com/FFTAI/Wiki-GRx-Models (Dexterous_hand/fourier_hand_6dof)
    model_status: exact_official
    palm_link: L_hand_base_link
    wrist_frame: L_hand_base_link
    finger_base_joints: {index: L_index_proximal_joint, middle: L_middle_proximal_joint,
                         ring: L_ring_proximal_joint, pinky: L_pinky_proximal_joint}
    tips:
      thumb: {link: L_thumb_tip_link}
      index: {link: L_index_tip_link}
      middle: {link: L_middle_tip_link}
      ring: {link: L_ring_tip_link}
      pinky: {link: L_pinky_tip_link}

  brainco_revo2_right:
    family: brainco_revo2
    side: right
    urdf: external_hand_models/brainco_revo2/urdf/revo2_right_hand.urdf
    model_source: https://github.com/BrainCoTech/revo2_description
    model_status: exact_official
    palm_link: right_base_link
    wrist_frame: right_base_link
    finger_base_joints: {index: right_index_proximal_joint, middle: right_middle_proximal_joint,
                         ring: right_ring_proximal_joint, pinky: right_pinky_proximal_joint}
    tips:
      thumb: {link: right_thumb_tip_link}
      index: {link: right_index_tip_link}
      middle: {link: right_middle_tip_link}
      ring: {link: right_ring_tip_link}
      pinky: {link: right_pinky_tip_link}

  sharpa_wave_right:
    family: sharpa_wave
    side: right
    urdf: external_hand_models/sharpa-urdf-usd-xml/wave_01/right_sharpa_wave/right_sharpa_wave.urdf
    model_source: https://github.com/sharpa-robotics/sharpa-urdf-usd-xml (wave_01, Apache-2.0; byte-identical to the copy
      vendored by T-Rex dataset_quickstart/third_party, whose joint order the T-Rex authors verified against the data)
    model_status: exact_official
    palm_link: right_hand_C_MC
    wrist_frame: right_hand_C_MC
    # pinky has a CMC (metacarpal) joint 1 cm proximal to its knuckle: use the knuckle (MCP_FE) as base landmark,
    # taken with pinky_CMC = 0 (same convention as Shadow LFJ4 / LFJ5).
    finger_base_joints: {index: right_index_MCP_FE, middle: right_middle_MCP_FE, ring: right_ring_MCP_FE,
                         pinky: right_pinky_MCP_FE}
    tips:
      thumb: {link: right_thumb_fingertip}
      index: {link: right_index_fingertip}
      middle: {link: right_middle_fingertip}
      ring: {link: right_ring_fingertip}

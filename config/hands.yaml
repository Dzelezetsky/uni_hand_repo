    side: left
    urdf: external_hand_models/sharpa-urdf-usd-xml/wave_01/left_sharpa_wave/left_sharpa_wave.urdf
    model_source: https://github.com/sharpa-robotics/sharpa-urdf-usd-xml (wave_01, Apache-2.0; byte-identical to the copy
      vendored by T-Rex dataset_quickstart/third_party, whose joint order the T-Rex authors verified against the data)
    model_status: exact_official
    palm_link: left_hand_C_MC
    wrist_frame: left_hand_C_MC
    # pinky has a CMC (metacarpal) joint 1 cm proximal to its knuckle: use the knuckle (MCP_FE) as base landmark,
    # taken with pinky_CMC = 0 (same convention as Shadow LFJ4 / LFJ5).
    finger_base_joints: {index: left_index_MCP_FE, middle: left_middle_MCP_FE, ring: left_ring_MCP_FE,
                         pinky: left_pinky_MCP_FE}
    tips:
      thumb: {link: left_thumb_fingertip}
      index: {link: left_index_fingertip}
      middle: {link: left_middle_fingertip}
      ring: {link: left_ring_fingertip}
      pinky: {link: left_pinky_fingertip}

# Hands present in selected datasets for which no usable kinematic model exists (native import only).
missing_models:
  inspire_rh56dfx_gello: {datasets: [robomind_tienkung], status: missing_joint_mapping, reason: "Gello subset stores a single closure value per hand; per-finger state not recorded"}
  fourier_fdh12: {datasets: [fourier_actionnet], reason: "no public FDH-12 URDF found; FDH-6 model must not be reused"}
  fourier_6dof_on_gr2: {datasets: [fourier_actionnet], status: missing_joint_mapping, reason: "6-DoF hand on GR2, variant unconfirmed; same motor-unit problem as FDH-6"}
  agibot_g1_dexhand: {datasets: [agibot_world], reason: "exact G1 5-finger hand URDF/USD not public (AgiBot-World issue #155)"}
  fourier_fdh6_motor_units: {datasets: [fourier_actionnet], status: missing_joint_mapping, reason: "model exists (fourier_fdh6_*), but ActionNet stores DexHand SDK motor position params (0..~12), not joint angles; no public motor->joint transmission"}

# Validation log (status: visually_checked | auto_checks_only | unvalidated_assumptions).
# visually_checked = FK geometry compared against RGB frames of the same timestamp (unified/validation/*.png);
# it is NOT a metric calibration. Update this block whenever a model or mapping changes.
validation:
  xhand1_right:
    status: visually_checked
    evidence: "vitra 000130: flexion on tomato grasp matches head-cam frames (small in image). Model now RobotEra STAR1
      (identical finger kinematics to the SPIDER model used for that check). 0.2% samples exceed limits by <0.07 rad."
  shadow_e_right_realdex:
    status: visually_checked
    evidence: "realdex cylinder_1: finger flexion during cylinder grasp matches cam0; URDF shipped by RealDex."
  inspire_rh56dfx_right_unitree:
    status: visually_checked
    evidence: "H1 side assignment verified: ep_000324 fr339 ch0-5 closed = robot right hand holding duster; ep_000243
      fr189 ch6-11 closed = left hand grasping. Model = Unitree xr_teleoperate Inspire URDF (not vendor-certified BFX/DFX drawing)."
  inspire_rh56dfx_left_unitree:
    status: visually_checked
    evidence: "see inspire_rh56dfx_right_unitree; left URDF thumb differs from mirrored right by ~1 cm at rest."
  inspire_rh56dftp_right_hrdexdb:
    status: visually_checked
    evidence: "spam_can/0 t=15.9s: index extended, middle+ring flexed, little mostly open in cams 22641023/22645021
      = FK. QA: authors' thumb-rotation conversion reaches 1.40 rad vs URDF limit 1.15 rad (16% samples)."
  inspire_rh56f1_right_hrdexdb:
    status: visually_checked
    evidence: "washing_brush/0 t=9.7s: power grasp, all four fingers flexed in cam 22641023 = FK."
  leap_v2_adv_right:
    status: decoding_verified_command_only
    evidence: "Command decoding verified against the Manus glove targets used by DexWild's own IK (21.5 mm median
      fingertip residual vs 51.7 mm random). Still COMMANDS (IK solution), never a measured hand pose; contact
      blocking / tendon slack not observed. thumb_mcp_forward ~constant (-0.03) in sampled episodes. IK was run without
      joint limits: index_mcpf < 0 (up to -0.19 rad) in 38% of samples; the hardware node clips, so the physical
      finger sits near 0 there. Not clamped in the store (see limit_violation_frac)."

# RoboMIND Tien Kung Xsens uses the same models (hands = RH56DFX per RoboMIND paper). Mapping-level check:
#   plug_extract_from 2024-09-12-17-34-03 right hand: frame 169 fist while holding the plug, frame 325 open (camera_top,
#   low resolution) -> "1 = open" and side order confirmed; recorded in unified/validation/robomind_*.png.

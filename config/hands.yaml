# Hand kinematic model registry (one entry per physical hand model + side).
#
# model_status vocabulary (HANDS.md §3, extended):
#   exact_official                 model published by manufacturer/official project, matches dataset hardware
#   dataset_author_model           model shipped by the dataset authors for the exact hardware they recorded with
#   integrator_official            model published by the robot integrator for this hand on this robot (e.g. Unitree H1)
#   third_party_candidate          good public model, not from manufacturer / dataset authors; needs visual validation
#   missing_exact_model            no usable model -> native data only, FK disabled
#
# Palm frame (KINEMATICS.md): wrist point = origin of `wrist_frame`; finger bases = origins of `finger_base_joints`
# (first joint of each finger, fixed on the palm). Fingertip = origin of `tips.<f>.link` (+ offset) or, when a model
# has no tip frame, the distal-mesh vertex farthest from the distal joint (`mesh_extremal`).

hand_models:

  xhand1_right:
    family: xhand1
    side: right
    urdf: external_hand_models/roboterax_models/xhand1_right_star1.urdf
    model_source: https://github.com/roboterax/models (star1/urdf/l3_with_hand_fixedpin_xml.urdf, RobotEra official,
      BSD-3; hand sub-tree extracted by scripts/models/extract_star1_xhand.py). Finger joints identical to the former
      SPIDER model (facebookresearch/spider xhand_right.urdf).
    model_status: exact_official
    palm_link: right_hand_link
    wrist_frame: right_hand_link
    finger_base_joints: {index: right_hand_index_bend_joint, middle: right_hand_mid_joint1,
                         ring: right_hand_ring_joint1, pinky: right_hand_pinky_joint1}
    tips:
      thumb: {link: right_hand_thumb_rota_tip}
      index: {link: right_hand_index_rota_tip}
      middle: {link: right_hand_mid_tip}
      ring: {link: right_hand_ring_tip}
      pinky: {link: right_hand_pinky_tip}

  xhand1_left:
    family: xhand1
    side: left
    urdf: external_hand_models/roboterax_models/xhand1_left_star1.urdf
    model_source: https://github.com/roboterax/models (star1 URDF, RobotEra official, BSD-3; left hand sub-tree)
    model_status: exact_official
    palm_link: left_hand_link
    wrist_frame: left_hand_link
    finger_base_joints: {index: left_hand_index_bend_joint, middle: left_hand_mid_joint1,
                         ring: left_hand_ring_joint1, pinky: left_hand_pinky_joint1}
    tips:
      thumb: {link: left_hand_thumb_rota_tip}
      index: {link: left_hand_index_rota_tip}
      middle: {link: left_hand_mid_tip}
      ring: {link: left_hand_ring_tip}
      pinky: {link: left_hand_pinky_tip}

  shadow_e_right_realdex:
    family: shadow_dexterous_hand_e
    side: right
    urdf: external_code/RealDex/data_preprocess/assets/bimanual_srhand_ur.urdf
    model_source: https://github.com/4DVLab/RealDex (data_preprocess/assets/bimanual_srhand_ur.urdf; Shadow sr_description)
    model_status: dataset_author_model
    palm_link: rh_palm
    wrist_frame: rh_palm
    finger_base_joints: {index: rh_FFJ4, middle: rh_MFJ4, ring: rh_RFJ4, pinky: rh_LFJ4}  # LFJ4 = pinky knuckle (LFJ5 metacarpal at 0)
    tips:
      thumb: {link: rh_thtip}
      index: {link: rh_fftip}
      middle: {link: rh_mftip}
      ring: {link: rh_rftip}
      pinky: {link: rh_lftip}

  leap_v2_adv_right:
    family: leap_hand_v2_advanced
    side: right
    urdf: external_hand_models/leap_v2_advanced/leap_v2/leap_v2/leap_v2_right/robot.urdf
    model_source: https://github.com/leap-hand/LEAP_Hand_V2_Adv_API (leap_v2/leap_v2/leap_v2_right/robot.urdf)
    model_status: exact_official
    palm_link: no_finger_frame_mirror
    # URDF root origin is a CAD point 13 cm off the palm; no wrist frame exists. Wrist = centroid of the proximal end
    # (vertices within 5 mm of max extent along the finger axis) of palm mesh no_finger_frame_mirror.stl, palm-link coords.
    wrist_point: [-0.0031, 0.0850, -0.1304]
    # NOTE: index..pinky first joints sit on the articulated 4-finger palm plate (palm_4_finger joint);
    # landmarks are taken at palm_4_finger = 0, plate articulation then shows up as fingertip motion.
    finger_base_joints: {index: index_mcpf, middle: middle_mcpf, ring: ring_mcpf, pinky: pinky_mcpf}
    tips:
      thumb: {link: realtip_5}
      index: {link: realtip}
      middle: {link: realtip_2}
      ring: {link: realtip_3}
      pinky: {link: realtip_4}

  inspire_rh56dfx_right_unitree:
    family: inspire_rh56dfx
    side: right
    urdf: external_hand_models/unitree_xr_teleoperate/assets/inspire_hand/inspire_hand_right.urdf
    model_source: https://github.com/unitreerobotics/xr_teleoperate (assets/inspire_hand; Unitree H1/G1 Inspire DFX)
    model_status: integrator_official
    palm_link: R_hand_base_link
    wrist_frame: R_hand_base_link
    finger_base_joints: {index: R_index_proximal_joint, middle: R_middle_proximal_joint,
                         ring: R_ring_proximal_joint, pinky: R_pinky_proximal_joint}
    tips:
      thumb: {link: R_thumb_tip}
      index: {link: R_index_tip}
      middle: {link: R_middle_tip}
      ring: {link: R_ring_tip}
      pinky: {link: R_pinky_tip}

  inspire_rh56dfx_left_unitree:
    family: inspire_rh56dfx
    side: left
    urdf: external_hand_models/unitree_xr_teleoperate/assets/inspire_hand/inspire_hand_left.urdf
    model_source: https://github.com/unitreerobotics/xr_teleoperate (assets/inspire_hand; Unitree H1/G1 Inspire DFX)
    model_status: integrator_official
    palm_link: L_hand_base_link
    wrist_frame: L_hand_base_link
    finger_base_joints: {index: L_index_proximal_joint, middle: L_middle_proximal_joint,
                         ring: L_ring_proximal_joint, pinky: L_pinky_proximal_joint}
    tips:
      thumb: {link: L_thumb_tip}
      index: {link: L_index_tip}
      middle: {link: L_middle_tip}
      ring: {link: L_ring_tip}
      pinky: {link: L_pinky_tip}

  inspire_rh56dftp_right_hrdexdb:
    family: inspire_rh56dftp
    side: right
    urdf: raw_data/hrdexdb/assets/robots/xarm_inspire_DFTP.urdf
    model_source: https://huggingface.co/datasets/HRDexDB/HRDexDB (assets/robots/xarm_inspire_DFTP.urdf)
    model_status: dataset_author_model
    palm_link: base_link
    wrist_frame: base_link
    finger_base_joints: {index: right_index_1_joint, middle: right_middle_1_joint,
                         ring: right_ring_1_joint, pinky: right_little_1_joint}
    tips:  # URDF has no tip frames -> farthest distal-mesh vertex from the distal joint
      thumb: {link: right_thumb_4, mesh_extremal: raw_data/hrdexdb/assets/robots/inspire/meshes_right/right_thumb_4.STL}
      index: {link: right_index_2, mesh_extremal: raw_data/hrdexdb/assets/robots/inspire/meshes_right/right_index_2.STL}
      middle: {link: right_middle_2, mesh_extremal: raw_data/hrdexdb/assets/robots/inspire/meshes_right/right_middle_2.STL}
      ring: {link: right_ring_2, mesh_extremal: raw_data/hrdexdb/assets/robots/inspire/meshes_right/right_ring_2.STL}
      pinky: {link: right_little_2, mesh_extremal: raw_data/hrdexdb/assets/robots/inspire/meshes_right/right_little_2.STL}

  inspire_rh56f1_right_hrdexdb:
    family: inspire_rh56f1
    side: right
    urdf: raw_data/hrdexdb/assets/robots/xarm_inspire_f1_right.urdf
    model_source: https://huggingface.co/datasets/HRDexDB/HRDexDB (assets/robots/xarm_inspire_f1_right.urdf)
    model_status: dataset_author_model
    palm_link: base_link
    wrist_frame: base_link
    finger_base_joints: {index: right_index_1_joint, middle: right_middle_1_joint,
                         ring: right_ring_1_joint, pinky: right_little_1_joint}
    tips:
      thumb: {link: thumb_tip}
      index: {link: index_tip}
      middle: {link: middle_tip}
      ring: {link: ring_tip}
      pinky: {link: little_tip}

  ruiyan_ryh2_right_egosteer:
    family: ruiyan_ryh2
    side: right
    urdf: external_hand_models/egosteer_ruiyan/ruiyan_hand_mjcf/right/ruiyan_ryh2_right.urdf
    model_source: https://github.com/egosteer/robot-stack (assets/ruiyan_hand_mjcf/right/hand.xml @ba06f62, converted by
      scripts/models/mjcf_to_urdf_ruiyan.py; coupling as in the authors' hand_fk_node.py). URDF FK == shipped fingertips.
    model_status: dataset_author_model
    palm_link: hand2_link_base
    wrist_frame: hand2_link_base
    finger_base_joints: {index: hand2_joint_link_2_1, middle: hand2_joint_link_3_1,
                         ring: hand2_joint_link_4_1, pinky: hand2_joint_link_5_1}
    tips:
      thumb: {link: right_thumb_tip}
      index: {link: right_index_tip}
      middle: {link: right_middle_tip}
      ring: {link: right_ring_tip}
      pinky: {link: right_pinky_tip}

  ruiyan_ryh2_left_egosteer:
    family: ruiyan_ryh2
    side: left
    urdf: external_hand_models/egosteer_ruiyan/ruiyan_hand_mjcf/left/ruiyan_ryh2_left.urdf
    model_source: https://github.com/egosteer/robot-stack (assets/ruiyan_hand_mjcf/left/hand.xml @ba06f62, converted by
      scripts/models/mjcf_to_urdf_ruiyan.py; coupling as in the authors' hand_fk_node.py). URDF FK == shipped fingertips.
    model_status: dataset_author_model
    palm_link: hand1_link_base
    wrist_frame: hand1_link_base
    finger_base_joints: {index: hand1_joint_link_2_1, middle: hand1_joint_link_3_1,
                         ring: hand1_joint_link_4_1, pinky: hand1_joint_link_5_1}
    tips:
      thumb: {link: left_thumb_tip}
      index: {link: left_index_tip}
      middle: {link: left_middle_tip}
      ring: {link: left_ring_tip}
      pinky: {link: left_pinky_tip}

  fourier_fdh6_right:
    family: fourier_fdh6
    side: right
    urdf: external_hand_models/fourier_models/Dexterous_hand/fourier_hand_6dof/urdf/fourier_right_hand_6dof.urdf
    model_source: https://github.com/FFTAI/Wiki-GRx-Models (Dexterous_hand/fourier_hand_6dof)
    model_status: exact_official
    palm_link: R_hand_base_link
    wrist_frame: R_hand_base_link
    finger_base_joints: {index: R_index_proximal_joint, middle: R_middle_proximal_joint,
                         ring: R_ring_proximal_joint, pinky: R_pinky_proximal_joint}
    tips:
      thumb: {link: R_thumb_tip_link}
      index: {link: R_index_tip_link}
      middle: {link: R_middle_tip_link}
